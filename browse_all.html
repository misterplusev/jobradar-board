function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function draw(){
  const q=(document.getElementById('q').value||'').toLowerCase();
  const co=document.getElementById('fCo').value, sr=document.getElementById('fSrc').value;
  const sc=document.getElementById('fSc').value;
  let out=[];
  for(const d of DATA){
    if(co && d.c!==co)continue;
    if(sr && d.src!==sr)continue;
