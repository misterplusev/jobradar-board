<!doctype html><html lang=en><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>Job Radar</title><style>
:root{color-scheme:dark}body{margin:0;font:14px system-ui;background:#050506;color:#e8e8e8}
header{padding:16px 20px;border-bottom:1px solid #222}h1{margin:0;font-size:20px}
.controls{display:flex;gap:10px;flex-wrap:wrap;padding:14px 20px;position:sticky;top:0;background:#050506;border-bottom:1px solid #1a1a1a}
input,select{background:#0c0c0e;color:#eee;border:1px solid #2a2a2a;border-radius:8px;padding:8px}
table{width:100%;border-collapse:collapse}td,th{padding:8px 12px;border-bottom:1px solid #161616;text-align:left;vertical-align:top}
th{position:sticky;top:64px;background:#0a0a0b;cursor:pointer}
.score{font-weight:800;text-align:center;width:44px}
a{color:#7aa2ff;text-decoration:none}.muted{color:#8a8a8a;font-size:12px}
.pill{font-size:11px;padding:2px 7px;border:1px solid #2a2a2a;border-radius:999px;color:#bcbcbc}
</style></head><body>
<header><h1>Job Radar</h1><div class=muted id=count></div></header>
<div class=controls>
 <input id=q placeholder="search title / company / location" size=34>
 <label>min score <input id=min type=number value=70 min=0 max=100 style=width:70px></label>
 <select id=src></select>
 <label><input type=checkbox id=remote> remote only</label>
</div>
<table><thead><tr><th data-k=score>Fit</th><th data-k=title>Title</th><th data-k=company>Company</th><th data-k=location>Location</th><th data-k=source>Source</th></tr></thead><tbody id=tb></tbody></table>
<script>
const DATA=[{"score": 82, "archetype": "robotics technician", "company": "Amazon", "title": "Mechatronics & Robotics Tech", "location": "Loveland, Colorado, USA", "url": "https://www.amazon.jobs/en/jobs/10504275/mechatronics-robotics-tech", "source": "amazon", "rationale": "The candidate\u2019s Army command experience and DoorDash Labs robotics field work directly align with safety, maintenance, and troubleshooting duties of the role. Minor gaps exist in specific MHE hardware exposure and formal technician credenti"}, {"score": 82, "archetype": "Finance\u2011Ops Analyst", "company": "Flyzipline", "title": "Strategic Finance Manager, Operations", "location": "South San Francisco, California, USA", "url": "https://www.zipline.com/open-roles?gh_jid=7828301003", "source": "greenhouse", "rationale": "The candidate brings proven management, financial\u2011services, and data\u2011analytics skills that align with the role\u2019s need for operational insight and modeling, but lacks formal corporate FP&A background and industry\u2011specific logistics finance e"}, {"score": 82, "archetype": "Robotics Field Tech", "company": "Amazon", "title": "Mechatronics & Robotics Tech", "location": "Chandler, Arizona, USA", "url": "https://www.amazon.jobs/en/jobs/10507130/mechatronics-robotics-tech", "source": "amazon", "rationale": "Candidate brings hands-on autonomous robot operations and large-scale equipment accountability, but lacks specific material-handling equipment exposure and has only brief industry robotics tenure."}, {"score": 80, "archetype": "Fleet Ops Manager", "company": "Flyzipline", "title": "Fleet Configuration & Change Manager", "location": "South San Francisco, California, USA", "url": "https://www.zipline.com/open-roles?gh_jid=7824306003", "source": "greenhouse", "rationale": "Strong logistics leadership and hands\u2011on robotics fleet experience align with fleet configuration and change management needs, though limited robotics tenure and lack of formal hardware engineering background are notable gaps."}, {"score": 80, "archetype": "Finance/Operations hybrid", "company": "Amazon", "title": "Finance Manager, WW Operations Working Capital & Free Cash Flow", "location": "Bellevue, Washington, USA", "url": "https://www.amazon.jobs/en/jobs/10494197/finance-manager-ww-operations-working-capital-free-cash-flow", "source": "amazon", "rationale": "Candidate brings strong financial services, budgeting, and data analytics background with proven leadership, but lacks direct FP&A and working capital cash flow experience typical for the role. While the Army finance-like accountability and"}, {"score": 80, "archetype": "short", "company": "Amazon", "title": "Sales Operations Manager II, Hub Pickup and Return Points", "location": "Bellevue, Washington, USA", "url": "https://www.amazon.jobs/en/jobs/10505965/sales-operations-manager-ii-hub-pickup-and-return-points", "source": "amazon", "rationale": "Candidate offers strong leadership, logistics planning, and AI/ML model\u2011building from military and analytics work, but lacks direct sales operations and Salesforce background required for the role."}, {"score": 78, "archetype": "Technical Operations Specialist", "company": "Waymo", "title": "Staff Software Quality Safety Operations Specialist", "location": "Mountain View, CA, United States; Remote, United States", "url": "https://careers.withwaymo.com/jobs?gh_jid=7816014", "source": "greenhouse", "rationale": "Candidate\u2019s hands\u2011on robotics field work, data\u2011pipeline expertise, and large\u2011team leadership align closely with Waymo\u2019s SWQOps safety and automation needs. Gaps are mainly formal AI/ML credentials and corporate software\u2011team management expe"}, {"score": 78, "archetype": "Technical Lab Manager", "company": "Amazon", "title": "Technical Lab Manager - Robotics R&D, Frontier AI & Robotics", "location": "San Francisco, California, USA", "url": "https://www.amazon.jobs/en/jobs/10426076/technical-lab-manager-robotics-r-d-frontier-ai-robotics", "source": "amazon", "rationale": "The candidate brings proven leadership and robotics field ops, but lacks direct hardware assembly, mechanical design, and extensive lab-specific experience needed for the role."}, {"score": 78, "archetype": "Robotics Field Operations Specialist", "company": "Waymo", "title": "Software Quality Operations Specialist", "location": "Remote", "url": "https://careers.withwaymo.com/jobs?gh_jid=7942677", "source": "greenhouse", "rationale": "Candidate brings direct autonomous vehicle field operations experience and proven large-scale logistics leadership, but has limited tenure in robotics and no formal software quality/triage background."}, {"score": 77, "archetype": "Operations Analyst with robotics fleet ops and quant finance background", "company": "Waymo", "title": "Operations Analyst, Demand Operations & Service Quality", "location": "San Francisco, CA, USA", "url": "https://careers.withwaymo.com/jobs?gh_jid=8053284", "source": "greenhouse", "rationale": "Candidate brings direct autonomous fleet operations experience (DoorDash Labs) and strong quantitative modeling skills, but falls short on the preferred hyper-growth tech/consulting background and has only ~5 years of professional analytics"}, {"score": 77, "archetype": "Operations Leader with Autonomous Fleet Experience", "company": "Flyzipline", "title": "Strategic Operations Manager", "location": "South San Francisco, California, USA", "url": "https://www.zipline.com/open-roles?gh_jid=7776545003", "source": "greenhouse", "rationale": "Candidate meets core operational requirements with large-scale logistics command and hands-on autonomous fleet experience; preferred-background gaps (consulting/IB/PE/hyper-growth) and limited robotics tenure keep score in high-70s."}, {"score": 62, "archetype": "Technical Operator", "company": "Flyzipline", "title": "Forward Deployed AI Engineer, Operations", "location": "South San Francisco, California, USA", "url": "https://www.zipline.com/open-roles?gh_jid=7764239003", "source": "greenhouse", "rationale": "The candidate\u2019s strong operational leadership and proven ability to build ML\u2011driven systems align well with Zipline\u2019s need for practical AI engineers, though his lack of professional GenAI experience and limited robotics tenure are notable "}, {"score": 62, "archetype": "operations leader", "company": "Flyzipline", "title": "Industrial & Operations Engineer", "location": "South San Francisco, California, USA", "url": "https://www.zipline.com/open-roles?gh_jid=7887075003", "source": "greenhouse", "rationale": "Strong leadership, autonomous\u2011ops, and data\u2011engineering background align with Zipline\u2019s factory\u2011performance focus, but the lack of an engineering degree and hands\u2011on manufacturing time\u2011study experience are notable gaps."}, {"score": 62, "archetype": "plausible stretch", "company": "Flyzipline", "title": "Business Operations Manager, Supply Chain", "location": "South San Francisco, California, USA", "url": "https://www.zipline.com/open-roles?gh_jid=7818180003", "source": "greenhouse", "rationale": "Candidate brings exceptional operational leadership and hands-on autonomous systems experience, but lacks corporate supply chain depth and strategic sourcing background required for this high-visibility scaling role."}, {"score": 58, "archetype": "short", "company": "Robinhood", "title": "Trading Specialist", "location": "Chicago, IL; Denver, CO; Lake Mary, FL", "url": "https://boards.greenhouse.io/robinhood/jobs/8125789?t=gh_src=&gh_jid=8125789", "source": "greenhouse", "rationale": "Candidate brings proven leadership, technical operations, and data\u2011driven automation skills that align with the role\u2019s process\u2011improvement and AI\u2011tool focus, but lacks the mandatory FINRA licenses and direct trading\u2011operations experience."}, {"score": 58, "archetype": "Training/Operations", "company": "Waymo", "title": "Training Delivery Manager (Fleet Maintenance & Validation TTT)", "location": "San Francisco, CA, USA; Tempe, AZ, USA", "url": "https://careers.withwaymo.com/jobs?gh_jid=8049302", "source": "greenhouse", "rationale": "Candidate brings extensive leadership, training, and safety experience from Army command and financial services, but lacks the required automotive service instructional background, LMS exposure, and vendor/training team management needed fo"}, {"score": 55, "archetype": "Adjacent ops planner", "company": "Waymo", "title": "Operations Planning Manager (New Markets & Platforms)", "location": "Remote, USA", "url": "https://careers.withwaymo.com/jobs?gh_jid=7435595", "source": "greenhouse", "rationale": "Candidate brings strong logistics planning and autonomous fleet operations experience but lacks the preferred advanced degree and high-velocity tech/consulting background; relevant but stretch for Waymo's validation planning role."}, {"score": 38, "archetype": "technical operations lead", "company": "Amazon", "title": "Applied Science Manager - Match & Affordances, Amazon Robotics", "location": "Seattle, Washington, USA", "url": "https://www.amazon.jobs/en/jobs/10406269/applied-science-manager-match-affordances-amazon-robotics", "source": "amazon", "rationale": "The candidate brings proven people\u2011management and large\u2011scale logistics experience, plus hands\u2011on robotics and data\u2011science work, but lacks the advanced degree, AI/ML background, and direct software\u2011engineering team leadership required for "}, {"score": 38, "archetype": "Risk Analyst", "company": "Coinbase", "title": "Payments Risk Analyst II", "location": "Remote - USA", "url": "https://www.coinbase.com/careers/positions/7984814?gh_jid=7984814", "source": "greenhouse", "rationale": "Candidate shows strong data, SQL, and leadership skills but lacks the required payments fraud prevention, ACH knowledge, and fraud\u2011tooling experience. These gaps prevent a solid match for the Payments Risk Analyst II role."}, {"score": 38, "archetype": "PMM", "company": "Coinbase", "title": "Senior Product Marketing Manager, Trading", "location": "Remote - USA", "url": "https://www.coinbase.com/careers/positions/8077090?gh_jid=8077090", "source": "greenhouse", "rationale": "Candidate lacks the required 8+ years of product marketing in trading/consumer apps and direct trading product marketing experience. Strong analytical, leadership, and financial services background provide some transferable strengths but no"}, {"score": 38, "archetype": "operations leader", "company": "Amazon", "title": "Sr. Design Operations Manager, Amazon Ads - Brand Innovation Lab", "location": "Seattle, Washington, USA", "url": "https://www.amazon.jobs/en/jobs/10502344/sr-design-operations-manager-amazon-ads-brand-innovation-lab", "source": "amazon", "rationale": "The candidate proves strong people\u2011management, budget stewardship, and technical operations skills that align with the operational excellence and scaling aspects of the role. However, they lack direct design system, UX, and creative\u2011industr"}, {"score": 38, "archetype": "Safety Operations", "company": "Waymo", "title": "System Safety Engineer, Operations & Fleet Response", "location": "Mountain View, CA, USA; San Francisco, CA, USA; Los Angeles, CA, USA; Kirkland, WA, USA", "url": "https://careers.withwaymo.com/jobs?gh_jid=7361677", "source": "greenhouse", "rationale": "Candidate shows strong leadership and hands\u2011on fleet ops but lacks the engineering degree and deep system\u2011safety background required for the role."}, {"score": 35, "archetype": "individual_contributor", "company": "Amazon", "title": "Member Of Technical Staff - Hardware Science, Frontier AI & Robotics (FAR)", "location": "San Francisco, California, USA", "url": "https://www.amazon.jobs/en/jobs/10424277/member-of-technical-staff-hardware-science-frontier-ai-robotics-far", "source": "amazon", "rationale": "The candidate brings practical robotics fleet ops and strong analytical/leadership skills, but lacks the advanced research background and graduate credentials the role demands."}, {"score": 35, "archetype": "poor fit", "company": "Coinbase", "title": "Compliance, Threat & Risk Assessment Manager", "location": "Remote - USA", "url": "https://www.coinbase.com/careers/positions/8064692?gh_jid=8064692", "source": "greenhouse", "rationale": "Candidate lacks required 8+ years compliance risk experience and deep AML/CFT expertise; seniority gap caps score at 45 but overall fit is poor."}, {"score": 30, "archetype": "short", "company": "Waymo", "title": "Senior Manager, Product Data Science - Fleet Optimization and Orchestration", "location": "Mountain View, CA, US; San Francisco, CA, US", "url": "https://careers.withwaymo.com/jobs?gh_jid=7964897", "source": "greenhouse", "rationale": "Candidate shows strong leadership and hands\u2011on robotics/data\u2011science background but falls short on the required years of experience, team management, and production OR/model work. Seniority of the role exceeds the candidate\u2019s level, capping"}, {"score": 30, "archetype": "career_pivot", "company": "Amazon", "title": "Accounting Manager \u2013 Robotics & Fulfillment Technologies, Amazon Stores Accounting", "location": "Seattle, Washington, USA", "url": "https://www.amazon.jobs/en/jobs/10474604/accounting-manager-robotics-fulfillment-technologies-amazon-stores-accounting", "source": "amazon", "rationale": "Candidate brings exceptional analytical and operations leadership but has no accounting credentials, GAAP experience, or ERP background required for an Accounting Manager role; this is a career pivot, not a lateral move."}, {"score": 25, "archetype": "PhD Research Intern", "company": "Amazon", "title": "2026 Applied Science Internship - United States, PhD Student Science Recruiting, Frontier AI & Robotics", "location": "San Francisco, California, USA", "url": "https://www.amazon.jobs/en/jobs/3127861/2026-applied-science-internship-united-states-phd-student-science-recruiting-frontier-ai-robotics", "source": "amazon", "rationale": "The internship targets PhD students with top-tier publications and specialized expertise in multimodal LLMs, Sim2Real, and vision-language-action models; the candidate holds only a B.A., has no research publications, and lacks the required "}];let sortK="score",asc=false;
const tb=document.getElementById("tb"),q=document.getElementById("q"),mn=document.getElementById("min"),
 src=document.getElementById("src"),rem=document.getElementById("remote"),cnt=document.getElementById("count");
const sources=[...new Set(DATA.map(d=>d.source).filter(Boolean))].sort();
src.innerHTML="<option value=''>all sources</option>"+sources.map(s=>`<option>${s}</option>`).join("");
function color(s){return s>=85?"#6ee7b7":s>=70?"#fcd34d":"#9aa0a6"}
function render(){let r=DATA.filter(d=>{
 if(d.score<+mn.value)return false;
 if(src.value&&d.source!==src.value)return false;
 if(rem.checked&&!/remote/i.test(d.location))return false;
 const t=(q.value||"").toLowerCase();
 return !t||`${d.title} ${d.company} ${d.location}`.toLowerCase().includes(t);});
 r.sort((a,b)=>{const x=a[sortK],y=b[sortK];const c=(""+x).localeCompare(""+y,undefined,{numeric:true});return asc?c:-c;});
 cnt.textContent=r.length+" matches";
 tb.innerHTML=r.map(d=>`<tr><td class=score style="color:${color(d.score)}">${d.score}</td>
 <td><a href="${d.url}" target=_blank>${d.title}</a><div class=muted>${d.rationale}</div></td>
 <td>${d.company}</td><td>${d.location}</td><td><span class=pill>${d.source}</span></td></tr>`).join("");}
document.querySelectorAll("th").forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(k===sortK)asc=!asc;else{sortK=k;asc=false}render()});
[q,mn,src,rem].forEach(el=>el.addEventListener("input",render));render();
</script></body></html>
